  - name: om-foreningen
    label: Sida – Om föreningen
    type: file
    path: src/om-foreningen.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: omgivning
    label: Sida – Omgivning & Strandhugg
    type: file
    path: src/omgivning.md
    format: yaml-frontmatter
    fields:
      - name: title
