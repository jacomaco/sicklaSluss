  - name: vanner
    label: Sida – Sicklaslussens vänner
    type: file
    path: src/vanner.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
