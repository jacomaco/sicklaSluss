settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"

media:
  - name: bilder
    label: Bilder
    input: src/static/images
    output: /static/images
    categories: [image]
    commit:
      templates:
        create: "media(create): {filename}"
        update: "media(update): {filename}"
        delete: "media(delete): {filename}"
        rename: "media(rename): {oldFilename} -> {newFilename}"
  - name: albumbilder
    label: Bildreportagebilder
    input: src/images/bildreportage
    output: /static/images/bildreportage
    categories: [image]
    commit:
      templates:
        create: "media(create): {filename}"
        update: "media(update): {filename}"
        delete: "media(delete): {filename}"
        rename: "media(rename): {oldFilename} -> {newFilename}"
  - name: dokument
    label: Dokument (artiklar)
    input: src/static/artiklar
    output: /static/artiklar
    categories: [document]
    commit:
      templates:
        create: "media(create): {filename}"
        update: "media(update): {filename}"
        delete: "media(delete): {filename}"
        rename: "media(rename): {oldFilename} -> {newFilename}"

content:
  - name: nyheter
    label: Nyheter
    type: collection
    path: src/nyheter
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Rubrik
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
      - name: summary
        label: Sammanfattning (visas på förstasidan)
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          path: nyheter
          switcher: true

  - name: album
    label: Bildreportage
    type: collection
    path: src/bildreportage
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Rubrik
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
      - name: folder
        label: Mappnamn för bilderna
        type: string
        required: true
        description: "Bilderna ligger under mediabiblioteket Bildreportagebilder i en mapp med samma namn som här, t.ex. 2026-08-30_slussdag. Ladda upp/lägg bilderna där; fotogalleriet byggs automatiskt."
      - name: cover
        label: Omslagsbild (filnamn, valfritt)
        type: string
        description: "Filnamn på bilden som ska visas som omslag, t.ex. IMG_2675.JPG. Lämna tomt för att använda första bilden i mappen."
      - name: period
        label: Period
        type: select
        options:
          values:
            - name: nutida
              label: Nutida
            - name: historiskt
              label: Historiskt (visas sist, datum döljs)

  - name: artiklar
    label: Artiklar
    type: collection
    path: src/artiklar
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Rubrik
        type: string
        required: true
      - name: label
        label: Datumetikett (visas före rubriken)
        type: string
        required: true
      - name: date
        label: Datum (för sortering)
        type: date
        required: true
      - name: type
        label: Typ
        type: select
        options:
          values:
            - name: A
              label: A – historiskt/vetenskapligt intresse
            - name: I
              label: I – information och skrivelser
            - name: N
              label: N – nyhetsartikel
      - name: group
        label: Sektion
        type: select
        options:
          values:
            - name: ny
              label: Nyare artiklar
            - name: ark
              label: Historiska artiklar (arkiv)
      - name: file
        label: Länk till artikel (fil i Dokument)
        type: file
        options:
          media: dokument
      - name: pdf
        label: Pdf-kopia – visas som [som pdf]
        type: file
        options:
          media: dokument
      - name: link
        label: Extern länk (om ingen fil)
        type: string
      - name: attr
        label: Extratext efter ” –” (t.ex. källa)
        type: text

  - name: att-slussa
    label: Sida – Att slussa
    type: file
    path: src/att-slussa.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: historik
    label: Sida – Historik
    type: file
    path: src/historik.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: slupar
    label: Undersida – Ångslupar
    type: file
    path: src/historik/slupar.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: in-english
    label: Sida – In English
    type: file
    path: src/in-english.md
    format: yaml-frontmatter
    fields:
      - name: h1
        label: Rubrik (välkomsttext)
        type: string
      - name: leadImage
        label: Toppbild
        type: image
        options:
          media: bilder
          path: in-english
      - name: leadImageAlt
        label: Beskrivning av toppbilden
        type: string
      - name: title
        label: Rubrik (meny/tabbläsare)
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: om-foreningen
    label: Sida – Om föreningen
    type: file
    path: src/om-foreningen.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: omgivning
    label: Sida – Omgivning & Strandhugg
    type: file
    path: src/omgivning.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: vanner
    label: Sida – Sicklaslussens vänner
    type: file
    path: src/vanner.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Rubrik
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: bilder
          switcher: true

  - name: webbplats
    label: Webbplatsinställningar
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: title
        label: Webbplatsens namn
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: url
        label: Webbadress
        type: string
      - name: noindex
        label: Dölj webbplatsen för sökmotorer (testversion)
        type: boolean
      - name: telephone
        label: Telefon (visning)
        type: string
      - name: telephoneLink
        label: Telefon (länk)
        type: string
      - name: email
        label: E-post
        type: string
      - name: nav
        label: Meny
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Namn
            type: string
          - name: url
            label: Länk
            type: string
      - name: sponsors
        label: Sponsorer
        type: object
        list:
          min: 0
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Namn
            type: string
          - name: url
            label: Länk
            type: string
          - name: image
            label: Bild
            type: image
            options:
              media: bilder
          - name: width
            label: Bildens bredd i pixlar
            type: number
            description: "Behövs för att sidan inte ska hoppa till när bilden laddas. Exempel: 140."
          - name: height
            label: Bildens höjd i pixlar
            type: number
            description: "Exempel: 99."

  - name: kalendarium
    label: Kalendarium (öppettider och slussdagar)
    type: file
    path: src/_data/kalendarium.json
    format: json
    fields:
      - name: year
        label: År
        type: number
      - name: seasonStart
        label: Säsongen börjar (svensk text, t.ex. "10 maj")
        type: string
      - name: seasonEnd
        label: Säsongen slutar (svensk text, t.ex. "27 sep")
        type: string
      - name: openingHours
        label: Drop-in-tider (svensk text)
        type: string
      - name: events
        label: Slussdagar (svenska)
        type: object
        list:
          min: 0
          collapsible:
            collapsed: true
            summary: "{date}"
        fields:
          - name: date
            label: Datum (text, t.ex. 23 maj)
            type: string
          - name: text
            label: Beskrivning
            type: string
      - name: english
        label: English
        type: object
        fields:
          - name: seasonStart
            label: Season starts
            type: string
          - name: seasonEnd
            label: Season ends
            type: string
          - name: openingHours
            label: Drop-in hours
            type: string
          - name: events
            label: Exhibition days
            type: object
            list:
              min: 0
              collapsible:
                collapsed: true
                summary: "{date}"
            fields:
              - name: date
                label: Date
                type: string
              - name: text
                label: Description
                type: string
