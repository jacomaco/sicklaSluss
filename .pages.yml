  - name: webbplats
    label: Webbplatsinställningar
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: title
        label: Webbplatsens namn
        type: string
      - name: description
        label: Beskrivning
        type: text
      - name: url
        label: Webbadress
        type: string
      - name: telephone
        label: Telefon (visning)
        type: string
      - name: telephoneLink
        label: Telefon (länk)
        type: string
      - name: email
        label: E-post
        type: string
      - name: nav
        label: Meny
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Namn
            type: string
          - name: url
            label: Länk
            type: string
      - name: sponsors
        label: Sponsorer
        type: object
        list:
          min: 0
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Namn
            type: string
          - name: url
            label: Länk
            type: string
          - name: image
            label: Bild
            type: image
            options:
              media: bilder