name: Bygg och publicera till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Återanvänd färdigbearbetade album Bilder mellan bygg. Filnamnen
      # innehåller en hash av källbilden, så cachade filer kan aldrig bli
      # inaktuella.
      - name: Cache generated album images
        uses: actions/cache@v4
        with:
          path: _site/static/images/bildreportage
          key: album-images-${{ runner.os }}-${{ hashFiles('src/images/bildreportage/**', 'eleventy.config.mjs') }}
          restore-keys: |
            album-images-${{ runner.os }}-

      - run: npm ci

      - run: npm run build

      - name: Check internal links
        run: npm run check:links

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4